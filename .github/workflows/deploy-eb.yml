name: Deploy to Elastic Beanstalk (staging)

on:
  push:
    branches:
      - chore/aws-beanstalk-rds-deploy
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: zip -r deploy.zip . -x '.git/*' '.github/*' '.elasticbeanstalk/*'

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: vendorhub-backend
          environment_name: vendorhub-staging
          region: eu-west-1
          version_label: "gh-${{ github.sha }}"
          deployment_package: deploy.zip
